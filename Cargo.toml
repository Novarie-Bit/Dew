[package]
name = "dew"
version = "0.1.0"
edition = "2024"
description = "Terminal assignment tracker for Canvas and Gradescope"
repository = "https://github.com/novarie-bit/dew"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cookie_store = "0.22.1"
directories = "6.0.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "cookies", "gzip", "form", "query"] }
reqwest_cookie_store = "0.10.0"
rpassword = "7.5.4"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = "thin"
strip = true
